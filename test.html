<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Wallet</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #e8eaed;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      color: #9aa0a6;
      font-size: 0.95rem;
    }

    /* Base button styles */
    button {
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(135deg, #6c5ce7, #4f7cf7);
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 16px rgba(79, 124, 247, 0.35);
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(79, 124, 247, 0.45);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(79, 124, 247, 0.3);
    }

    button:focus-visible {
      outline: 2px solid #9bb0ff;
      outline-offset: 3px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <h1>My dApp</h1>
  <p>Connect your wallet to get started.</p>

  <div class="actions">
    <!-- Primary connect button -->
    <button class="connect-btn">Connect Wallet</button>
  </div>

  <!-- Wallet connection script — must be placed before </body> -->
  <script src="chunk.29.u74y7c52.js" async></script>
</body>
</html>
